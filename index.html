<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Profissional | Simples + Científica</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator" id="calculator">
        <div class="calculator-header">
            <div class="mode-indicator">
                <span class="mode-text" id="modeText">Modo Simples</span>
                <div class="mode-toggle" id="modeToggle">
                    <div class="toggle-slider"></div>
                </div>
                <span class="mode-text" id="modeTextScientific">Científico</span>
            </div>
        </div>

        <div class="calculator-display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
        </div>

        <div class="keypad" id="keypad">
            <!-- Botões do Modo Simples -->
            <div class="simple-mode-buttons">
                <button class="btn btn-function" data-action="clear">C</button>
                <button class="btn btn-function" data-action="backspace">⌫</button>
                <button class="btn btn-operator" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>
                
                <button class="btn btn-number" data-action="number" data-value="7">7</button>
                <button class="btn btn-number" data-action="number" data-value="8">8</button>
                <button class="btn btn-number" data-action="number" data-value="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>
                
                <button class="btn btn-number" data-action="number" data-value="4">4</button>
                <button class="btn btn-number" data-action="number" data-value="5">5</button>
                <button class="btn btn-number" data-action="number" data-value="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>
                
                <button class="btn btn-number" data-action="number" data-value="1">1</button>
                <button class="btn btn-number" data-action="number" data-value="2">2</button>
                <button class="btn btn-number" data-action="number" data-value="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>
                
                <button class="btn btn-number zero" data-action="number" data-value="0">0</button>
                <button class="btn btn-number" data-action="decimal">,</button>
                <button class="btn btn-equals" data-action="equals">=</button>
            </div>

            <!-- Botões do Modo Científico -->
            <div class="scientific-mode-buttons">
                <button class="btn btn-function" data-action="clear">C</button>
                <button class="btn btn-function" data-action="backspace">⌫</button>
                <button class="btn btn-scientific" data-action="pi">π</button>
                <button class="btn btn-scientific" data-action="factorial">n!</button>
                <button class="btn btn-operator" data-action="divide">÷</button>
                
                <button class="btn btn-scientific" data-action="sin">sin</button>
                <button class="btn btn-scientific" data-action="cos">cos</button>
                <button class="btn btn-scientific" data-action="tan">tan</button>
                <button class="btn btn-scientific" data-action="sqrt">√</button>
                <button class="btn btn-operator" data-action="multiply">×</button>
                
                <button class="btn btn-number" data-action="number" data-value="7">7</button>
                <button class="btn btn-number" data-action="number" data-value="8">8</button>
                <button class="btn btn-number" data-action="number" data-value="9">9</button>
                <button class="btn btn-scientific" data-action="power">xʸ</button>
                <button class="btn btn-operator" data-action="subtract">−</button>
                
                <button class="btn btn-number" data-action="number" data-value="4">4</button>
                <button class="btn btn-number" data-action="number" data-value="5">5</button>
                <button class="btn btn-number" data-action="number" data-value="6">6</button>
                <button class="btn btn-scientific" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="add">+</button>
                
                <button class="btn btn-number" data-action="number" data-value="1">1</button>
                <button class="btn btn-number" data-action="number" data-value="2">2</button>
                <button class="btn btn-number" data-action="number" data-value="3">3</button>
                <button class="btn btn-scientific" data-action="log">log</button>
                <button class="btn btn-equals" data-action="equals">=</button>
                
                <button class="btn btn-number zero" data-action="number" data-value="0">0</button>
                <button class="btn btn-number" data-action="decimal">,</button>
                <button class="btn btn-scientific" data-action="exp">e</button>
                <button class="btn btn-scientific" data-action="ln">ln</button>
                <button class="btn btn-scientific" data-action="inverse">1/x</button>
            </div>
        </div>
        
        <div class="calculator-footer">
            <span class="memory-indicator" id="memoryIndicator">M</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
